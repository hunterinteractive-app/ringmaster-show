name: Legal agreement browser regression

on:
  pull_request:
    paths:
      - '.github/workflows/legal-agreement-regression.yml'
      - 'lib/main.dart'
      - 'lib/config/legal_config.dart'
      - 'lib/services/legal_acceptance_service.dart'
      - 'lib/screens/login_screen.dart'
      - 'lib/screens/show_list_screen.dart'
      - 'lib/screens/legal/**'
      - 'test/legal_auth_navigation_test.dart'
      - 'lib/widgets/convention_sale_banner.dart'
      - 'lib/models/convention_sale.dart'
      - 'test/convention_sale_banner_web_test.dart'

permissions:
  contents: read

jobs:
  browser-agreement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --platform chrome --reporter expanded test/legal_auth_navigation_test.dart test/convention_sale_banner_web_test.dart
