name: Deploy Flutter Web to Cloudflare Pages

on:
  push:
    branches:
      - main
      - test/ada-accessibility
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run accessibility and Chester regression tests
        run: flutter test test/exhibitor_entry_order_test.dart test/entry_section_selection_dialog_test.dart test/add_fur_wool_dialog_test.dart test/edit_entry_dialog_test.dart test/upcoming_show_visibility_test.dart test/print_reports_service_test.dart test/checkin_release_test.dart test/checkin_before_finalize_test.dart test/accessibility_widget_test.dart test/accessibility_color_contrast_test.dart test/no_email_exhibitor_option_test.dart test/show_assistant_test.dart test/assistant_context_test.dart test/assistant_answer_editor_test.dart test/assistant_conversations_test.dart test/assistant_guide_links_test.dart test/assistant_support_test.dart test/convention_sale_test.dart test/legal_acceptance_service_test.dart test/support_idle_test.dart

      - name: Verify delegated show creation and account isolation
        run: flutter test --platform chrome test/enter_show_youth_selection_test.dart test/my_entries_section_edits_test.dart test/my_entries_fur_wool_test.dart test/meat_pen_dialog_test.dart test/print_reports_menu_test.dart test/admin_resources_pdf_test.dart test/support_delegation_test.dart test/secretary_dashboard_counts_test.dart test/cart_payment_preview_test.dart test/cart_fee_breakdown_test.dart test/entry_discount_codes_test.dart test/class_payback_test.dart test/custom_payback_widget_test.dart test/payback_report_loader_test.dart test/admin_add_entry_contrast_test.dart test/manual_report_delivery_widget_test.dart test/manual_exhibitor_information_policy_test.dart test/report_recipient_test.dart test/show_finances_test.dart test/cart_registration_requirements_test.dart test/exhibitor_school_information_test.dart test/show_addons_widget_test.dart

      - name: Verify COD awards and recognition boundaries
        run: |
          flutter test test/cod_award_eligibility_test.dart test/recognition_timeline_test.dart test/rabbit_results_rules_test.dart test/cavy_results_rules_test.dart test/report_population_regression_test.dart test/class_population_test.dart test/sweepstakes_cod_population_test.dart
          flutter test --platform chrome test/qr_results_save_widget_test.dart test/qr_results_species_widget_test.dart test/himalayan_awards_widget_test.dart test/support_user_search_widget_test.dart test/control_sheet_pilot_access_web_test.dart
          flutter test test/control_sheet_scan_test.dart

      - name: Verify independent operational report PDFs
        run: flutter test test/control_sheet_page_order_test.dart test/control_sheet_species_pdf_test.dart test/control_sheet_judging_order_test.dart test/closeout_status_error_message_test.dart test/results_readiness_details_test.dart test/final_award_readiness_display_test.dart test/operational_closeout_reports_test.dart test/club_report_grouping_test.dart test/state_club_email_package_test.dart test/report_email_confirmation_test.dart

      - name: Verify exhibitor award counts and mobile breed layouts
        run: flutter test test/exhibitor_award_populations_test.dart test/exhibitor_report_pdf_layout_test.dart test/breed_counts_mobile_layout_test.dart test/show_registration_notice_test.dart

      - name: Verify staged Show layouts
        run: |
          flutter test test/show_layout_rollout_test.dart test/submitted_balance_payment_test.dart
          flutter test --platform chrome test/show_layout_navigation_widget_test.dart

      - name: Verify report email duplicate protection
        run: npx --yes deno@2.9.6 test --config supabase/functions/deno.json --allow-env supabase/functions/send-report-email/handler_test.ts supabase/functions/send-club-report-batch/handler_test.ts

      - name: Verify Chester guidance and lookup safeguards
        run: npx --yes deno@2.9.6 test --config supabase/functions/deno.json supabase/functions/show-assistant/core_test.ts

      - name: Build Flutter Web
        run: |
          case "$SHOW_LAYOUT_ROLLOUT" in
            classic|super_admin_preview|opt_in|launched) ;;
            *) echo "Unknown SHOW_LAYOUT_ROLLOUT value" >&2; exit 1 ;;
          esac
          flutter build web --release --pwa-strategy=none --dart-define="SHOW_LAYOUT_ROLLOUT=$SHOW_LAYOUT_ROLLOUT"
        env:
          SHOW_LAYOUT_ROLLOUT: ${{ vars.SHOW_LAYOUT_ROLLOUT || 'super_admin_preview' }}

      - name: Deploy to Cloudflare Pages
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            npx wrangler pages deploy build/web --project-name ringmaster-show
          else
            npx wrangler pages deploy build/web --project-name ringmaster-show --branch="$GITHUB_REF_NAME"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
