name: Deploy Flutter Web to Cloudflare Pages

on:
  push:
    branches:
      - main
      - test/ada-accessibility

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run accessibility and Chester regression tests
        run: flutter test test/edit_entry_dialog_test.dart test/upcoming_show_visibility_test.dart test/print_reports_service_test.dart test/checkin_release_test.dart test/checkin_before_finalize_test.dart test/accessibility_widget_test.dart test/accessibility_color_contrast_test.dart test/no_email_exhibitor_option_test.dart test/show_assistant_test.dart test/assistant_context_test.dart test/assistant_answer_editor_test.dart test/assistant_conversations_test.dart test/assistant_guide_links_test.dart test/assistant_support_test.dart test/convention_sale_test.dart test/legal_acceptance_service_test.dart test/support_idle_test.dart

      - name: Verify delegated show creation and account isolation
        run: flutter test --platform chrome test/meat_pen_dialog_test.dart test/print_reports_menu_test.dart test/admin_resources_pdf_test.dart test/support_delegation_test.dart test/secretary_dashboard_counts_test.dart test/cart_payment_preview_test.dart test/entry_discount_codes_test.dart test/class_payback_test.dart test/custom_payback_widget_test.dart test/payback_report_loader_test.dart test/admin_add_entry_contrast_test.dart test/manual_report_delivery_widget_test.dart test/manual_exhibitor_information_policy_test.dart test/report_recipient_test.dart

      - name: Build Flutter Web
        run: flutter build web --release --pwa-strategy=none

      - name: Deploy to Cloudflare Pages
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            npx wrangler pages deploy build/web --project-name ringmaster-show
          else
            npx wrangler pages deploy build/web --project-name ringmaster-show --branch="$GITHUB_REF_NAME"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
